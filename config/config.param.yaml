/**:
  ros__parameters:
    publish_tf: true
    # Bags exported before boreas converts imu_raw still contain left-handed samples
    # (x-back, y-left, z-up). The imu extrinsic is a proper rotation from the
    # right-handed stand-in (x-back, y-right, z-up). Set this false after re-exporting
    # the bag, or the yaw correction is applied twice and the turn mirrors again.
    imu_left_handed: false
    parent_frame: "map"
    child_frame: "base_link"
    alignment_sample_count: 500
    stationary_gyro_thresh: 0.05
    stationary_accel_dev_thresh: 0.5
    gravity: 9.81
    max_dt: 0.1
    path_min_dt: 0.1
    path_max_poses: 1000
    time_field: "time"
    voxel_size: 0.5
    # Full length and width of the ICP cloud, centered on the vehicle.
    # 20 x 20 keeps ±10 m. The scan list uses the same box.
    crop_longitudinal: 50.0
    crop_lateral: 50.0
    max_correspondence_distance: 2.0
    kernel_scale: 0.5
    convergence_criterion: 0.0001
    max_iterations: 50
    max_points_per_voxel: 7
    max_visible_scans: 10
    # Recent scans kept with the lidar pose that inserted them.
    backward_match_stride: 4
    # Off: freezing each scan into the map drew the same building once per pose and stalled the scan callback.
    refine_window: true
    refine_settle_passes: 2
    # Accepted ICP residual fed back into the biases. Gains are per scan, in [0, 1].
    gyro_bias_gain: 0.1
    accel_bias_gain: 0.02
    speed_correction_gain: 0.5
    # Lidar keeps lateral shift and yaw. Forward motion stays with the IMU inside this band.
    max_longitudinal_correction: 0.15
    max_gyro_bias: 0.05
    max_accel_bias: 1.0
    max_speed: 20.0
    max_acceleration: 5.0
    max_yaw_rate: 1.0
    max_match_rejects: 5
    visual_enabled: true
    visual_odom_topic: "/visual_odom"
    min_scale_travel: 0.5
