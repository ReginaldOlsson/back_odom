/**:
  ros__parameters:
    node:
      show_debug_info: false
      # Each IMU twist runs predict and the queued pose update. dt is the twist stamp gap.
      predict_on_twist: true
      enable_yaw_bias_estimation: true
      # Nominal rate used for the first step, before two twist stamps exist. Boreas IMU is 200 Hz.
      predict_frequency: 200.0
      tf_rate: 200.0
      # 50 steps at 200 Hz is 0.25 s and would reject a lidar pose. 200 steps covers about 1 s.
      extend_state_step: 200

    pose_measurement:
      pose_additional_delay: 0.0
      pose_measure_uncertainty_time: 0.01
      pose_smoothing_steps: 5
      max_pose_queue_size: 5
      pose_gate_dist: 49.5

    twist_measurement:
      twist_additional_delay: 0.0
      # One application per IMU sample. A later cycle must not reuse the same twist.
      twist_smoothing_steps: 1
      max_twist_queue_size: 10
      twist_gate_dist: 46.1

    process_noise:
      proc_stddev_yaw_c: 0.005
      proc_stddev_vx_c: 10.0
      proc_stddev_wz_c: 5.0

    simple_1d_filter_parameters:
      z_filter_proc_dev: 5.0
      roll_filter_proc_dev: 0.1
      pitch_filter_proc_dev: 0.1

    diagnostics:
      pose_no_update_count_threshold_warn: 50
      pose_no_update_count_threshold_error: 100
      twist_no_update_count_threshold_warn: 50
      twist_no_update_count_threshold_error: 100
      ellipse_scale: 3.0
      error_ellipse_size: 1.5
      warn_ellipse_size: 1.2
      error_ellipse_size_lateral_direction: 0.3
      warn_ellipse_size_lateral_direction: 0.25
      diagnostics_publish_frequency: 10.0

    misc:
      threshold_observable_velocity_mps: 0.0
      pose_frame_id: "map"
